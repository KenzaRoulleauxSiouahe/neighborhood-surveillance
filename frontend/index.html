<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Neighbourhood Surveillance</title>

		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<h1>Neighbourhood Surveillance</h1>
		<h2>Neighbourhood Map</h2>
		<div id="game-container">
			<div id="camera-selection">
				<button class="camera-btn" data-camera="Camera 1">🎥 Camera 1</button>

				<button class="camera-btn" data-camera="Camera 2">🎥 Camera 2</button>

				<button class="camera-btn" data-camera="Camera 3">🎥 Camera 3</button>

				<button class="camera-btn" data-camera="Camera 4">🎥 Camera 4</button>
			</div>
			<div id="game-area">
				<div id="map">
					<div id="location-layer"></div>
					<div class="zone" data-zone="A1">A1</div>
					<div class="zone" data-zone="A2">A2</div>
					<div class="zone" data-zone="A3">A3</div>
					<div class="zone" data-zone="A4">A4</div>
					<div class="zone" data-zone="A5">A5</div>

					<div class="zone" data-zone="B1">B1</div>
					<div class="zone" data-zone="B2">B2</div>
					<div class="zone" data-zone="B3">B3</div>
					<div class="zone" data-zone="B4">B4</div>
					<div class="zone" data-zone="B5">B5</div>

					<div class="zone" data-zone="C1">C1</div>
					<div class="zone" data-zone="C2">C2</div>
					<div class="zone" data-zone="C3">C3</div>
					<div class="zone" data-zone="C4">C4</div>
					<div class="zone" data-zone="C5">C5</div>

					<div class="zone" data-zone="D1">D1</div>
					<div class="zone" data-zone="D2">D2</div>
					<div class="zone" data-zone="D3">D3</div>
					<div class="zone" data-zone="D4">D4</div>
					<div class="zone" data-zone="D5">D5</div>
					<button id="new-game-btn">New Game</button>
				</div>
			</div>

			<div id="camera-logs">
				<h3>Camera Logs</h3>

				<div id="logs">
					<p>No activity yet...</p>
				</div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
