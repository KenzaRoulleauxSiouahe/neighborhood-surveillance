services:
  mongodb:
    image: mongo:8
    container_name: neighbourhood-surveillance-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: neighbourhood-surveillance-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: neighbourhood-surveillance-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
