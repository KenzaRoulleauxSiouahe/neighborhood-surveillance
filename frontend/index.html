<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Neighbourhood Surveillance</title>

		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<h1>Neighbourhood Surveillance</h1>
		<h2>Neighbourhood Map</h2>
		<div id="game-container">
			<div id="camera-selection">
				<button>Camera 1</button>
				<button>Camera 2</button>
				<button>Camera 3</button>
				<button>Camera 4</button>
			</div>
			<div id="game-area">
				<div id="map">
					<div class="zone">A1</div>
					<div class="zone">A2</div>
					<div class="zone">A3</div>
					<div class="zone">A4</div>

					<div class="zone">B1</div>
					<div class="zone">B2</div>
					<div class="zone">B3</div>
					<div class="zone">B4</div>

					<div class="zone">C1</div>
					<div class="zone">C2</div>
					<div class="zone">C3</div>
					<div class="zone">C4</div>

					<div class="zone">D1</div>
					<div class="zone">D2</div>
					<div class="zone">D3</div>
					<div class="zone">D4</div>
				</div>
			</div>

			<div id="camera-logs">
				<h3>Camera Logs</h3>

				<div id="logs">
					<p>No activity yet...</p>
				</div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
